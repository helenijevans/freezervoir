vaadin:
  launch-browser: true

spring:
  application:
    name: freezervoir.version1

  datasource:
    url: jdbc:mysql://localhost:3306/freezervoir
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  output:
    ansi:
      enabled: ALWAYS
